# Alternativa a Neon: PostgreSQL local con Docker.
#   docker compose up -d
#   DATABASE_URL=postgresql://scuy:scuy@localhost:5432/scuy
#   TEST_DATABASE_URL=postgresql://scuy:scuy@localhost:5432/scuy_test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scuy
      POSTGRES_PASSWORD: scuy
      POSTGRES_DB: scuy
    ports:
      - "5432:5432"
    volumes:
      - scuy-db:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  scuy-db:
